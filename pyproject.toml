[project]
name = "sap-connector"
version = "0.1.1"
description = "Liest SAP-Fakturabelege (OData) und erzeugt über die Factora-API E-Rechnungen."
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sap-connector = "sap_connector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
